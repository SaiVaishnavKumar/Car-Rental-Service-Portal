<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="320" height="70">
  <defs>
    <linearGradient id="driveBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="driveOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Icon Emblem -->
  <g transform="translate(6, 6)" filter="url(#shadow)">
    <!-- Shield / Badge Background -->
    <rect x="0" y="0" width="58" height="58" rx="14" fill="url(#driveBlue)"/>
    
    <!-- Stylized Speed Lines -->
    <path d="M 8 36 L 22 36" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 12 42 L 26 42" stroke="url(#driveOrange)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Aerodynamic Sports Car Outline -->
    <path d="M 14 31 C 18 24 28 20 38 20 C 44 20 48 24 51 29 L 52 32 C 54 32.5 55 34 54 36 L 50 37 C 49 34 46 32 43 32 C 40 32 37 34 36 37 L 24 37 C 23 34 20 32 17 32 C 14.5 32 12.5 33.5 11.5 35.5 L 10 35 C 9.5 34 10 32 14 31 Z" fill="#ffffff"/>
    
    <!-- Car Wheels -->
    <circle cx="18" cy="37" r="4.5" fill="#0f172a"/>
    <circle cx="18" cy="37" r="2" fill="#38bdf8"/>
    <circle cx="43" cy="37" r="4.5" fill="#0f172a"/>
    <circle cx="43" cy="37" r="2" fill="#38bdf8"/>
    
    <!-- Windshield accent -->
    <path d="M 27 23 L 37 23 C 40 23 43 25 45 28 L 26 28 Z" fill="#0f172a" opacity="0.35"/>
  </g>

  <!-- Typography -->
  <g transform="translate(76, 24)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5" fill="#0f172a">
      Drive<tspan fill="#2563eb">Easy</tspan>
    </text>
    <text x="1" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="2.2" fill="#f59e0b">
      CAR RENTAL SERVICE PORTAL
    </text>
  </g>
</svg>