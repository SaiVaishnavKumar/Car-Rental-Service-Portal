<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="30%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="carGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>
  
  <!-- Subtle Studio Geometric Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- Background Lighting Aura -->
  <circle cx="400" cy="240" r="220" fill="#818cf8" opacity="0.12"/>

  <!-- Top Branding Overlay -->
  <g transform="translate(48, 48)">
    <rect x="0" y="0" width="160" height="26" rx="6" fill="#818cf8" opacity="0.2"/>
    <rect x="0" y="0" width="160" height="26" rx="6" stroke="#818cf8" stroke-width="1.2" fill="none"/>
    <text x="80" y="17" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5" text-anchor="middle">V-TEC SEDAN</text>
    
    <text x="0" y="58" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">HONDA <tspan fill="#818cf8">City ZX</tspan></text>
    <text x="0" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">Executive Comfort Sedan</text>
  </g>

  <!-- DriveEasy Watermark Tag -->
  <g transform="translate(620, 48)">
    <text x="130" y="24" fill="#ffffff" opacity="0.3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="end">Drive<tspan fill="#818cf8">Easy</tspan></text>
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="400" cy="380" rx="330" ry="24" fill="url(#groundGrad)"/>

  <!-- Car Group with Shadow -->
  <g filter="url(#carGlow)">
    
    <!-- Car Body -->
    <path d="M 120 315 L 170 295 L 240 230 C 270 205 320 195 380 195 L 530 195 C 580 195 625 225 660 275 L 720 305 C 735 315 740 335 730 350 L 655 355 C 645 320 610 295 570 295 C 530 295 495 320 485 355 L 330 355 C 320 320 285 295 245 295 C 205 295 170 320 160 355 L 90 355 C 80 345 80 330 95 320 Z" fill="url(#bodyGrad)" stroke="#334155" stroke-width="2"/>
    
    <!-- Cabin Windows (Tinted Glass) -->
    <path d="M 270 210 L 410 210 L 410 275 L 215 275 C 235 240 250 220 270 210 Z M 430 210 L 540 210 C 570 220 600 245 625 275 L 430 275 Z" fill="#090d16" stroke="#475569" stroke-width="1.5"/>

    <!-- Window Gloss Highlight -->
    <path d="M 290 205 L 360 205 L 310 265 L 245 265 Z" fill="#ffffff" opacity="0.15"/>
    <path d="M 440 205 L 500 205 L 450 265 L 390 265 Z" fill="#ffffff" opacity="0.15"/>

    <!-- Headlight & Taillight -->
    <path d="M 670 295 L 710 300 L 690 325 Z" fill="#ffffff" filter="drop-shadow(0 0 6px #818cf8)"/>
    <path d="M 120 310 L 95 320 L 110 335 Z" fill="#ef4444" filter="drop-shadow(0 0 6px #ef4444)"/>

    <!-- Body Accent Character Line -->
    <path d="M 170 310 Q 400 300 660 315" stroke="#818cf8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Door Seam & Handles -->
    <line x1="420" y1="210" x2="415" y2="345" stroke="#334155" stroke-width="1.5"/>
    <rect x="360" y="280" width="22" height="6" rx="3" fill="#1e293b"/>
    <rect x="440" y="280" width="22" height="6" rx="3" fill="#1e293b"/>
  </g>

  <!-- Front Wheel Assembly -->
  <g transform="translate(570, 355)">
    <!-- Outer Tire -->
    <circle cx="0" cy="0" r="44" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <circle cx="0" cy="0" r="32" fill="#1e293b"/>
    <!-- Alloy Rim Spokes -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#818cf8" stroke-width="3"/>
    <line x1="-24" y1="0" x2="24" y2="0" stroke="#cbd5e1" stroke-width="3.5"/>
    <line x1="0" y1="-24" x2="0" y2="24" stroke="#cbd5e1" stroke-width="3.5"/>
    <line x1="-17" y1="-17" x2="17" y2="17" stroke="#cbd5e1" stroke-width="3.5"/>
    <line x1="-17" y1="17" x2="17" y2="-17" stroke="#cbd5e1" stroke-width="3.5"/>
    <!-- Center Hub -->
    <circle cx="0" cy="0" r="10" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
  </g>

  <!-- Rear Wheel Assembly -->
  <g transform="translate(245, 355)">
    <!-- Outer Tire -->
    <circle cx="0" cy="0" r="44" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <circle cx="0" cy="0" r="32" fill="#1e293b"/>
    <!-- Alloy Rim Spokes -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#818cf8" stroke-width="3"/>
    <line x1="-24" y1="0" x2="24" y2="0" stroke="#cbd5e1" stroke-width="3.5"/>
    <line x1="0" y1="-24" x2="0" y2="24" stroke="#cbd5e1" stroke-width="3.5"/>
    <line x1="-17" y1="-17" x2="17" y2="17" stroke="#cbd5e1" stroke-width="3.5"/>
    <line x1="-17" y1="17" x2="17" y2="-17" stroke="#cbd5e1" stroke-width="3.5"/>
    <!-- Center Hub -->
    <circle cx="0" cy="0" r="10" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
  </g>

  <!-- Lower Ground Light Reflection -->
  <line x1="180" y1="410" x2="620" y2="410" stroke="#818cf8" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
</svg>